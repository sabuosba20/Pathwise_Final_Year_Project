<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" role="img" aria-labelledby="title desc">
  <title id="title">Pathwise logo and wordmark</title>
  <desc id="desc">A coral P containing a guided recommendation route beside the Pathwise wordmark, designed for a dark interface.</desc>
  <rect width="640" height="160" rx="28" fill="#171412"/>

  <g transform="translate(28 30)" aria-label="Pathwise symbol">
    <rect width="100" height="100" rx="23" fill="#201B18" stroke="#3A302B" stroke-width="2"/>
    <path fill="#EA7134" fill-rule="evenodd" d="M22 84V16H54C72.8 16 84 27.3 84 43.5S72.8 70 54 70H41V84H22Zm19-52v22h13c8.8 0 13-3.8 13-10.5C67 36.3 62.8 32 54 32H41Z"/>
    <g fill="none" stroke="#F7F1EA" stroke-linecap="round" stroke-linejoin="round">
      <path d="M31 76c0-11 1-17 11-21 9-4 4-10 12-15 3-2 6-3 10-3" stroke-width="4.25"/>
      <circle cx="31" cy="76" r="3.2" fill="#F7F1EA" stroke="none"/>
      <circle cx="43" cy="54.5" r="3.2" fill="#F7F1EA" stroke="#EA7134" stroke-width="2"/>
      <path d="m61 32 8 4.5-7.5 5.2" fill="#F7F1EA" stroke="none"/>
    </g>
  </g>

  <g aria-label="Pathwise wordmark">
    <text x="158" y="98" fill="#F7F1EA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="63" font-weight="700" letter-spacing="-2.4">Pathwise</text>
    <path d="M162 120h118c25 0 30 12 52 12h61" fill="none" stroke="#EA7134" stroke-width="4" stroke-linecap="round"/>
    <circle cx="397" cy="132" r="5" fill="#EA7134"/>
    <text x="416" y="137" fill="#B9AEA6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2.4">FIND YOUR NEXT COURSE</text>
  </g>
</svg>
